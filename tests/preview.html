<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0;background:#f4eddd;font:14px sans-serif;color:#30394e}#view{height:100vh;width:100vw}#panel{position:absolute;left:18px;top:18px;border-radius:13px;background:#fff6e4;padding:16px;max-width:420px}button{background:#f2cf75;border:0;border-radius:7px;padding:9px;margin:3px;font:inherit}p{font:12px monospace}</style></head><body><div id="view"></div><div id="panel"><b>Physics & feedback preview</b><p id="state"></p><button data-level="4">Apricot Hotel</button><button data-level="8">Grand Crunch</button><button id="blast">Dynamite hit</button><button id="ball">Ball hit</button><button id="clear">Careful auto clear</button><button id="pause">Pause</button></div><script type="module">
import {Demolition,initPhysics,freshProfile} from '../src/simulation.ts';import {Scene} from '../src/world.ts';await initPhysics();const profile=freshProfile();profile.unlocked=8;profile.upgrades.power=3;let game,auto=false;const world=new Scene(document.querySelector('#view'));function reset(level){game?.dispose();game=new Demolition(level,profile);world.reset();auto=false;}reset(4);for(const b of document.querySelectorAll('[data-level]'))b.onclick=()=>reset(Number(b.dataset.level));document.querySelector('#blast').onclick=()=>{const n=game.modules.find(n=>n.floor===0&&n.state==='standing');if(n)game.strike(n.id,'blast');};document.querySelector('#ball').onclick=()=>{const n=game.modules.find(n=>n.floor===0&&n.state==='standing');if(n)game.strike(n.id,'ball');};document.querySelector('#clear').onclick=()=>auto=true;document.querySelector('#pause').onclick=()=>game.paused=!game.paused;let last=performance.now(),acc=0;function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;acc+=dt;while(acc>=1/60){if(auto&&game.cooldown===0&&!game.pending&&game.phase==='active'){const n=game.modules.find(n=>n.floor===0&&n.state==='standing');if(n)game.strike(n.id,'breaker');}game.tick(1/60);acc-=1/60;}for(const e of game.events)world.event(e,game);game.events=[];world.update(game,game.paused?0:dt,game.paused?1:acc*60);document.querySelector('#state').textContent=`${game.config.name} / ${game.phase} / clear ${Math.round(game.progress*100)}% / energy ${game.energy} / neighbor ${game.neighbor.toFixed(0)}% / ${world.renderer.info.render.calls} draws`;requestAnimationFrame(frame);}requestAnimationFrame(frame);
</script></body></html>
